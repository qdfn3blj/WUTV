name: Build WUTV APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'catvod/**'
      - 'chaquo/**'
      - 'quickjs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10 (Chaquopy requirement)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android SDK (Platform 37 + Build Tools 37.0.0)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build mobile arm64 debug APK
        run: bash gradlew :app:assembleMobileArm64_v8aDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wutv-mobile-arm64-debug
          path: app/build/outputs/apk/mobileArm64_v8a/debug/*.apk
          retention-days: 30
